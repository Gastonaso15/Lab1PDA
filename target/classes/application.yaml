#   endpoints:
#     web:
#       exposure:
#         include: health,info
#   endpoint:
#     health:
#       show-details: when-authorized
#   security:
#     enabled: false

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://db:3306/culturarte?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: culturarte
    password: culturarte123

server:
  port: 8080
  servlet:
    context-path: /api
