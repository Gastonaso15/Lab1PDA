server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: culturarte-api
  
  datasource:
    url: jdbc:mysql://localhost:3307/culturarte?useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  security:
    user:
      name: admin
      password: admin

# JWT Configuration
jwt:
  secret: mySecretKey
  expiration: 86400

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://db:3306/culturarte?useSSL=false&serverTimezone=UTC
    username: root
    password: password

server:
  port: 8080
  servlet:
    context-path: /api
