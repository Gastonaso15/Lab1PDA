server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: culturarte-api
  
  datasource:
    url: jdbc:mysql://localhost:3307/culturarte?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: culturarte
    password: culturarte123
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
# Temporalmente deshabilitado para debugging
#  security:
#    user:
#      name: admin
#      password: admin

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:aVerySecureAndLongSecretKeyThatIsAtLeast256BitsLongForHMACAlgorithms1234567890}
  expiration: 86400

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

# Actuator Configuration - REMOVIDO para evitar conflictos
